# 前端容器内置 nginx：SPA 静态托管 + /api 反代后端
# 与 vite.config.ts 的代理口径一致（唯一前缀 /api），WebSocket 走同前缀升级

# $connection_upgrade：请求带 Upgrade 头（WS）时置 upgrade，普通请求置 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带指纹，可长缓存；SPA 路由回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反代后端容器（compose 网络内 DNS：backend）
    # vibe-agent 的 WebSocket 与普通 API 同前缀，统一带升级头
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
